version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: "/Architectural Patterns/MinimalApi"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      microsoft:
        patterns:
          - Microsoft.*
          - System.*
        update-types:
          - minor
          - patch
      others:
        patterns:
          - "*"
        exclude-patterns:
          - Microsoft.*
          - System.*
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/Architectural Patterns/MinimalApi/API"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
