name: Bug report
description: Something does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not report security problems here**; use the private channel described in [SECURITY.md](https://github.com/vitorparras/Project-Patterns-Implementation/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "main @ abc1234"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime or SDK version, browser, anything relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
