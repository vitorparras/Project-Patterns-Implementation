name: Feature request
description: Suggest a new pattern, example or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - "Yes, I can open a pull request"
        - "No, just suggesting"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions and this has not been proposed yet.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
